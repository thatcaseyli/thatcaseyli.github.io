      ["7676727478954413642","2026-08-22",94,174,33,27,["献给奶奶的战斗史诗｜\nThe Light We Fight For","Battle Epic for Grandma | The Light We Fight For","Kampf-Epos für die Großmutter | The Light We Fight For"],["献给奶奶的大型史诗交响。评论将它听成一场有战斗感的宏大制作，也送来了早日康复的祝愿。","A large-scale epic dedicated to Casey's grandmother. Listeners heard a combative, cinematic sweep and joined the wish for her recovery.","Ein großes Epos für Caseys Großmutter. Hörer beschrieben kämpferische, filmische Wucht und schlossen sich den Genesungswünschen an."]],
      ["7636383381010717897","2026-05-05",51,670,115,58,["写作业时的陪伴｜朝欢谣","Study Companion | Morning Joy Ballad","Lernbegleitung | Ballade der Morgenfreude"],["几乎只用黑键写成的五声调即兴，轻快又有古意。听众称赞旋律耐听，也把它当作写作业时反复播放的陪伴。","A pentatonic improvisation written almost entirely on black keys, both buoyant and ancient in colour. Listeners praised its replay value and even used it as a study companion.","Eine pentatonische Improvisation fast nur auf schwarzen Tasten, lebhaft und zugleich altertümlich. Hörer lobten ihren Wiederhörwert und nutzten sie sogar beim Lernen."]],
      ["7622552033379885961","2026-03-29",51,3022,880,285,["充满叙事张力｜午夜狂想","Narrative Tension | Midnight Rhapsody","Erzählspannung | Mitternachtsrhapsodie"],["织体复杂的爵士尝试，让左手也拥有独立旋律。评论喜欢它的叙事张力，认为技术与编排已经不止适合留在短视频里。","A dense jazz experiment that gives the left hand its own melodic voice. Listeners admired its narrative energy and felt the playing and arrangement deserved a larger stage.","Ein dichtes Jazzexperiment mit eigener Melodie in der linken Hand. Hörer mochten die erzählerische Energie und sahen Spiel und Arrangement auf einer größeren Bühne."]],
      ["7609244298228042971","2026-02-21",36,215000,49000,11257,["最受欢迎的旋律｜诙谐舞曲","Most-Loved Melody | Whimsical Dance","Beliebteste Melodie | Skurriler Tanz"],["明亮旋律里混入爵士语汇，形成轻巧又有推动力的诙谐舞曲。热烈反馈和持续点播让它成为目前最受欢迎的作品。","Bright melody meets a hint of jazz in a nimble dance with real forward motion. Strong listener response and repeated requests made it the collection's most popular work.","Helle Melodik trifft auf einen Hauch Jazz und wird zu einem beweglichen Tanz. Starke Resonanz und viele Musikwünsche machten ihn zum beliebtesten Werk der Sammlung."]],
      ["7587013795466333466","2025-12-23",48,5998,1797,352,["怪物舞会｜荒诞舞曲","Monsters' Ball | Absurd Dance","Ball der Monster | Absurder Tanz"],["凭直觉写下的怪诞爵士，以不寻常的和声制造顽皮感。评论把它想象成“怪物舞会”，怪异之外留下的却是快乐。","An instinctive strange-jazz improvisation whose unusual harmony feels mischievous. One listener imagined a 'monsters' ball': peculiar on the surface, joyful underneath.","Eine intuitive Strange-Jazz-Improvisation mit schelmischer Harmonik. Ein Hörer dachte an einen „Tanz der Monster“: außen seltsam, darunter voller Freude."]],
      ["7578140092390110310","2025-11-29",38,1723,403,146,["期待续写的完整版｜破晓序","Awaiting a Full Version | Dawn Prelude","Auf eine Vollversion wartend | Präludium der Morgendämmerung"],["清晨出现的旋律由简洁左手托起，随后走向更开阔的高潮。听众尤其喜欢后段，并反复期待它被续写成完整版。","A morning melody carried by a spare left hand before opening into a broader climax. Listeners singled out the later passage and repeatedly asked for a full version.","Eine Morgenmelodie über schlichter linker Hand, die sich zu einem weiten Höhepunkt öffnet. Besonders der spätere Abschnitt ließ Hörer nach einer Vollversion fragen."]],
      ["7567511147432447091","2025-11-01",68,1092,268,61,["梦里带回来的十三秒｜梦中的旋律","Thirteen Seconds from a Dream | Melody from a Dream","Dreizehn Sekunden aus einem Traum | Melodie aus einem Traum"],["醒来后仍记得梦里的前十三秒，于是把那份稍纵即逝的旋律扩写成一首脆弱而清澈的钢琴曲。","The first thirteen seconds survived waking from a dream, then grew into a piano piece that feels fragile, lucid and fleeting.","Die ersten dreizehn Sekunden blieben nach dem Erwachen aus einem Traum und wuchsen zu einem zerbrechlichen, klaren Klavierstück."]],
      ["7546135342715391259","2025-09-04",107,2362,657,181,["与命运正面抗争｜中子星","Confronting Fate | Neutron Star","Dem Schicksal entgegen | Neutronenstern"],["暗物质系列中更明亮的一章，保留未经修改的原始力度。评论听见了激情，以及一种与命运正面抗争的气势。","A brighter chapter in the Dark Matter series, preserving the force of an unedited first take. Listeners heard passion and the feeling of confronting fate head-on.","Ein helleres Kapitel der Dunkle-Materie-Reihe mit der Kraft eines unbearbeiteten ersten Takes. Hörer vernahmen Leidenschaft und den direkten Kampf mit dem Schicksal."]],
      ["7529957944197713179","2025-07-23",25,2905,567,435,["未完成即悬念｜黑暗童话","Unfinished Suspense | Dark Fairytale","Unvollendete Spannung | Dunkles Märchen"],["一段仍在寻找方向的短篇创作，把灵感暂时停下时的原始状态完整保留，也让未完成本身成为悬念。","A short work still searching for its direction, preserving the exact moment inspiration paused and turning its unfinished state into suspense.","Eine kurze Skizze auf der Suche nach ihrer Richtung. Sie bewahrt den Moment, in dem die Inspiration innehielt, und macht das Unvollendete zur Spannung."]],
      ["7525404005045243186","2025-07-10",102,141000,33000,30000,["从宿命走向救赎｜暗物质","From Fate to Salvation | Dark Matter","Vom Schicksal zur Erlösung | Dunkle Materie"],["沉重宿命感逐渐转入西方古典色彩与救赎感。这部突破性作品让大量听众开始期待更大的舞台与未来的正式发行。","A heavy sense of fate gradually turns toward Western classical colour and release. This breakout work led many listeners to imagine a larger stage and future official releases.","Schwere Schicksalhaftigkeit wandelt sich in westlich-klassische Farben und Erlösung. Das Erfolgsstück ließ viele Hörer an eine größere Bühne und künftige Veröffentlichungen denken."]],
      ["7524711264132861235","2025-07-08",30,2026,343,217,["雨天童年记忆｜朦胧雨天","Rainy Day Memory | Hazy Rainy Day","Regentag-Erinnerung | Trüber Regentag"],["雨天想到的旋律，多年后成为短小钢琴曲。听众从中认出了难以描述的童年想象，并希望能够拿到乐谱继续演奏。","A melody imagined on a rainy day, finally shaped into a short piano piece. Listeners recognised a hard-to-name childhood feeling and asked for a score to play it themselves.","Eine Melodie von einem Regentag, Jahre später als kurzes Klavierstück. Hörer erkannten darin ein schwer benennbares Kindheitsgefühl und fragten nach Noten."]],
      ["7522416208559033626","2025-07-02",41,7193,926,1231,["毫无保留的灵感｜光影狂想","Unreserved Inspiration | Light & Shadow Rhapsody","Uneingeschränkte Inspiration | Licht-Schatten-Rhapsodie"],["没有预先练习的纯即兴，旋律与和声全凭直觉向前冲。它最打动人的正是灵感到来时毫无保留的能量。","An entirely unpractised improvisation, with melody and harmony driven forward by instinct. Its appeal lies in the unreserved energy of inspiration arriving in real time.","Eine völlig ungeprobte Improvisation, deren Melodie und Harmonie allein vom Instinkt vorangetrieben werden. Ihre Stärke ist die ungefilterte Energie des Augenblicks."]],
      ["7519063270055300362","2025-06-23",75,22725,4795,6555,["噪音中涌起的海浪｜纸舟焚海","Waves from Noise | Paper Boat in a Burning Sea","Wellen aus Lärm | Papierboot im brennenden Meer"],["从嘈杂环境中诞生的即兴，把干扰转化成带有海浪般起伏的推进感；错音与急促也保留了现场的真实。","Born in a noisy room, this improvisation turns interruption into wave-like momentum. Wrong notes and haste remain as part of its honest, live character.","In einem lauten Raum entstanden, verwandelt diese Improvisation Störung in wellenartige Bewegung. Fehler und Eile bleiben Teil ihres ehrlichen Live-Charakters."]],
      ["7517301983159078194","2025-06-18",63,11813,2521,812,["低谷里闯入的光｜桎·星芒","Light in the Dark | Shackles · Starlight","Licht im Dunkeln | Fesseln · Sternenlicht"],["前半段悬疑而宿命，转调后逐渐走向治愈。评论把它形容为人生低谷里突然闯入的一束光。","Suspense and fate shape the opening before a modulation turns toward healing. One listener described it as a ray of light suddenly entering life at its lowest point.","Spannung und Schicksal prägen den Anfang, bevor eine Modulation zur Heilung führt. Ein Hörer beschrieb es als Lichtstrahl, der im tiefsten Moment ins Leben fällt."]],
      ["7516197247278042406","2025-06-15",56,7145,1495,889,["听众命名的神秘曲｜镜中之秘","Named by Listeners | Secret in the Mirror","Von Hörern benannt | Geheimnis im Spiegel"],["从随手弹出的音开始，即兴慢慢长成完整作品。它的神秘色彩也激发听众参与命名，留下了“镜中之秘”等想象。","Beginning with casually played notes, the improvisation gradually becomes a complete piece. Its mystery invited listeners to suggest titles such as 'Secret in the Mirror'.","Aus beiläufigen Tönen wächst allmählich ein vollständiges Stück. Seine geheimnisvolle Farbe regte Hörer zu Titeln wie „Geheimnis im Spiegel“ an."]],
      ["7515097608332168457","2025-06-13",71,7244,1738,421,["失落与治愈之间｜灯未熄","Between Loss and Healing | The Lamp Still Burns","Zwischen Verlust und Heilung | Die Lampe erlischt nicht"],["梦中旋律在日落的失落与治愈之间展开，结尾仍保留即兴痕迹。评论最直接的遗憾是太短，听完仍意犹未尽。","A dreamed melody unfolds between sunset melancholy and consolation, ending with traces of improvisation. Listeners' clearest complaint was that it ended too soon.","Eine geträumte Melodie entfaltet sich zwischen Abendmelancholie und Trost und endet improvisiert. Die häufigste Klage der Hörer: Sie ist viel zu kurz."]],
      ["7510624567725018418","2025-05-31",33,2330,364,114,["春风未至琴声先暖｜春の低语","Warm Before Spring | Whispers of Spring","Warm vor dem Frühling | Frühlingsgeflüster"],["春风未至，琴声先暖。评论反复提到阳光、活力与旧日惬意，也赞叹简单音调组合出的丰富感受。","The piano warms before the spring wind arrives. Listeners repeatedly mentioned sunlight, vitality and easy memories, praising the feeling built from a simple tune.","Noch vor dem Frühlingswind wird der Klavierklang warm. Hörer nannten Sonne, Lebendigkeit und unbeschwerte Erinnerungen und lobten die Wirkung der einfachen Melodie."]],
